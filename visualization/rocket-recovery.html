<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HAMS Rocket Recovery</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #5f6c67;
      --line: #d8dfda;
      --panel: #ffffff;
      --wash: #eef4f1;
      --sea: #3a8b96;
      --hull: #7d8b91;
      --accent: #c44930;
      --green: #227a52;
      --amber: #b7791f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #f7faf8;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 6px 8px;
      border-radius: 6px;
    }

    nav a[aria-current="page"] {
      color: var(--ink);
      background: var(--wash);
    }

    main {
      display: grid;
      grid-template-columns: minmax(420px, 1.15fr) minmax(360px, 0.85fr);
      gap: 18px;
      padding: 18px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .viewer {
      min-height: 560px;
      border: 1px solid var(--line);
      background: #fbfdfc;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    #scene {
      width: 100%;
      height: 100%;
      min-height: 560px;
      display: block;
    }

    .hud {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .pill {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .side, .wide {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .wide {
      grid-column: 1 / -1;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    section {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 14px;
      overflow: hidden;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    select {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
      padding: 5px 8px;
      font-size: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border-left: 3px solid var(--sea);
      padding: 8px 9px;
      background: #f8fbfa;
      min-height: 64px;
    }

    .metric strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    svg {
      width: 100%;
      height: 280px;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child {
      text-align: left;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    .dot.fail {
      background: var(--accent);
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin: 8px 0 0;
    }

    .empty {
      padding: 32px;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      main, .wide {
        grid-template-columns: 1fr;
      }

      .viewer, #scene {
        min-height: 420px;
      }

      .controls, .metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>矩形驳船着陆腿落甲板模型</h1>
    <nav>
      <a href="viewer.html">3D Mesh</a>
      <a href="results.html">HAMS Results</a>
      <a href="rocket-recovery.html" aria-current="page">Rocket Recovery</a>
      <a href="nargolkar-2025.html">Paper 2025</a>
      <a href="wang-2023.html">Wang 2023</a>
      <a href="landing-leg-contact.html">Leg Contact</a>
      <a href="integrated-recovery.html">Integrated</a>
      <a href="chrono-recovery.html">Chrono</a>
    </nav>
  </header>

  <main id="app">
    <section class="viewer">
      <canvas id="scene"></canvas>
      <div class="hud" id="sceneHud"></div>
    </section>

    <div class="side">
      <section>
        <h2>Case Controls</h2>
        <div class="controls">
          <label>Deck Point<select id="pointSelect"></select></label>
          <label>Heading<select id="headingSelect"></select></label>
          <label>Sea State<select id="seaStateSelect"></select></label>
        </div>
        <p class="note" id="caseNote"></p>
      </section>

      <section>
        <h2>Selected Sea State</h2>
        <div class="metrics" id="metricGrid"></div>
      </section>

      <section>
        <h2>Validation</h2>
        <div id="validation"></div>
      </section>
    </div>

    <div class="wide">
      <section>
        <h2>Deck Point RAO</h2>
        <svg id="raoChart" role="img" aria-label="Deck point RAO chart"></svg>
      </section>
      <section>
        <h2>Sea-State Worst Cases</h2>
        <div id="seaSummary"></div>
      </section>
    </div>
  </main>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="rocket-recovery-data.js"></script>
  <script>
    const data = window.ROCKET_RECOVERY_DATA;
    const app = document.getElementById("app");

    if (!data) {
      app.innerHTML = '<section class="empty">rocket-recovery-data.js is missing. Generate it with recovery_window_report.py.</section>';
      throw new Error("Missing rocket recovery data");
    }

    const state = {
      pointId: data.case.deck_points[0].id,
      heading: data.case.headings_deg[0],
      seaStateId: data.case.sea_states[0].id,
    };

    function fmt(value, digits = 3) {
      if (!Number.isFinite(value)) return "n/a";
      if (Math.abs(value) >= 1000 || Math.abs(value) < 0.001 && value !== 0) return value.toExponential(2);
      return value.toFixed(digits);
    }

    function pointById(id) {
      return data.deckRao.points.find(point => point.id === id);
    }

    function seaPointById(id) {
      return data.seaResponse.points.find(point => point.id === id);
    }

    function selectedSeaState(point) {
      return point.sea_states.find(stateRow => stateRow.id === state.seaStateId);
    }

    function selectedHeadingRow(seaState) {
      return seaState.headings.find(row => Number(row.heading_deg) === Number(state.heading));
    }

    function populateControls() {
      const pointSelect = document.getElementById("pointSelect");
      const headingSelect = document.getElementById("headingSelect");
      const seaStateSelect = document.getElementById("seaStateSelect");

      pointSelect.innerHTML = data.case.deck_points.map(point => `<option value="${point.id}">${point.id}</option>`).join("");
      headingSelect.innerHTML = data.case.headings_deg.map(heading => `<option value="${heading}">${heading.toFixed(0)} deg</option>`).join("");
      seaStateSelect.innerHTML = data.case.sea_states.map(sea => `<option value="${sea.id}">Hs ${sea.hs_m} m / Tp ${sea.tp_s} s</option>`).join("");

      pointSelect.value = state.pointId;
      headingSelect.value = String(state.heading);
      seaStateSelect.value = state.seaStateId;

      pointSelect.addEventListener("change", () => { state.pointId = pointSelect.value; update(); });
      headingSelect.addEventListener("change", () => { state.heading = Number(headingSelect.value); update(); });
      seaStateSelect.addEventListener("change", () => { state.seaStateId = seaStateSelect.value; update(); });
    }

    function updateCaseNote() {
      const p = data.case.platform;
      document.getElementById("caseNote").textContent =
        `L ${p.length_m} m, B ${p.beam_m} m, draft ${p.draft_m} m, deck z ${p.deck_z_m} m. Angular RAO uses raw HAMS radians.`;
      document.getElementById("sceneHud").innerHTML = [
        `Hull panels ${data.mesh.hull.rawPanels}`,
        `Waterplane panels ${data.mesh.waterplane.rawPanels}`,
        `Frequencies ${data.deckRao.frequencies_rad_s.length}`,
        `Headings ${data.deckRao.headings_deg.length}`,
      ].map(text => `<span class="pill">${text}</span>`).join("");
    }

    function updateMetrics() {
      const point = seaPointById(state.pointId);
      const sea = selectedSeaState(point);
      const heading = selectedHeadingRow(sea);
      const metrics = heading.metrics;
      const items = [
        ["Vertical velocity MPM", metrics.vertical_velocity_m_s.most_probable_max, "m/s"],
        ["Vertical displacement RMS", metrics.vertical_displacement_m.rms, "m"],
        ["Horizontal velocity MPM", metrics.horizontal_velocity_m_s.most_probable_max, "m/s"],
        ["Tilt MPM", metrics.tilt_rad.most_probable_max * 180 / Math.PI, "deg"],
      ];
      document.getElementById("metricGrid").innerHTML = items.map(([label, value, unit]) =>
        `<div class="metric"><strong>${fmt(value)}</strong><span>${label} ${unit}</span></div>`
      ).join("");
    }

    function rowsForSelectedPointHeading() {
      const point = pointById(state.pointId);
      return point.rows.filter(row => Number(row.heading_deg) === Number(state.heading));
    }

    function drawChart() {
      const svg = document.getElementById("raoChart");
      const rows = rowsForSelectedPointHeading();
      const series = [
        { name: "z disp m/m", color: "#3a8b96", values: rows.map(row => [row.frequency_rad_s, row.displacement_m.z.amp]) },
        { name: "z vel m/s per m", color: "#c44930", values: rows.map(row => [row.frequency_rad_s, row.velocity_m_s.z.amp]) },
        { name: "h vel m/s per m", color: "#7a5ab5", values: rows.map(row => [row.frequency_rad_s, Math.hypot(row.velocity_m_s.x.amp, row.velocity_m_s.y.amp)]) },
        { name: "tilt deg/m", color: "#b7791f", values: rows.map(row => [row.frequency_rad_s, Math.hypot(row.angles_rad.roll.amp, row.angles_rad.pitch.amp) * 180 / Math.PI]) },
      ];
      renderLineChart(svg, series);
    }

    function renderLineChart(svg, series) {
      const width = svg.clientWidth || 620;
      const height = svg.clientHeight || 280;
      const margin = { left: 48, right: 16, top: 18, bottom: 42 };
      const xs = series.flatMap(item => item.values.map(point => point[0]));
      const ys = series.flatMap(item => item.values.map(point => point[1]));
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const maxY = Math.max(...ys, 1e-9);
      const xScale = x => margin.left + (x - minX) / (maxX - minX) * (width - margin.left - margin.right);
      const yScale = y => height - margin.bottom - y / maxY * (height - margin.top - margin.bottom);
      const grid = [0, 0.25, 0.5, 0.75, 1].map(t => {
        const y = margin.top + t * (height - margin.top - margin.bottom);
        return `<line x1="${margin.left}" x2="${width - margin.right}" y1="${y}" y2="${y}" stroke="#e6ece8" />`;
      }).join("");
      const paths = series.map(item => {
        const d = item.values.map((point, index) => `${index ? "L" : "M"}${xScale(point[0]).toFixed(2)},${yScale(point[1]).toFixed(2)}`).join(" ");
        return `<path d="${d}" fill="none" stroke="${item.color}" stroke-width="2.2" />`;
      }).join("");
      const legend = series.map((item, index) =>
        `<g transform="translate(${margin.left + index * 124},${height - 14})"><rect width="10" height="10" fill="${item.color}" rx="2"/><text x="15" y="10">${item.name}</text></g>`
      ).join("");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = `
        ${grid}
        <line x1="${margin.left}" x2="${width - margin.right}" y1="${height - margin.bottom}" y2="${height - margin.bottom}" stroke="#93a19b" />
        <line x1="${margin.left}" x2="${margin.left}" y1="${margin.top}" y2="${height - margin.bottom}" stroke="#93a19b" />
        ${paths}
        <text x="${margin.left}" y="${height - 24}" fill="#5f6c67">omega rad/s</text>
        <text x="${margin.left}" y="14" fill="#5f6c67">max ${fmt(maxY, 2)}</text>
        ${legend}
      `;
    }

    function updateSeaSummary() {
      const rows = data.seaResponse.summary.map(row => {
        const vv = row.worst_mpm.vertical_velocity_m_s;
        const hv = row.worst_mpm.horizontal_velocity_m_s;
        const tilt = row.worst_mpm.tilt_rad;
        return `<tr>
          <td>${row.sea_state_id}</td>
          <td>${fmt(vv.value)} @ ${vv.point_id}, ${vv.heading_deg} deg</td>
          <td>${fmt(hv.value)} @ ${hv.point_id}, ${hv.heading_deg} deg</td>
          <td>${fmt(tilt.value * 180 / Math.PI)} @ ${tilt.point_id}, ${tilt.heading_deg} deg</td>
        </tr>`;
      }).join("");
      document.getElementById("seaSummary").innerHTML = `
        <table>
          <thead><tr><th>Sea state</th><th>vz MPM m/s</th><th>vh MPM m/s</th><th>tilt MPM deg</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function updateValidation() {
      const self = data.validation.bargeSelfCheck;
      const bench = data.validation.benchmarkRegression;
      const report = data.validation.reportValidation;
      const items = [
        ["Barge self-check", self.passed],
        ["Benchmark regression", bench.passed],
        ["Report data", report.passed],
      ];
      document.getElementById("validation").innerHTML = `
        <table>
          <tbody>
            ${items.map(([label, ok]) => `<tr><td>${label}</td><td><span class="status"><span class="dot ${ok ? "" : "fail"}"></span>${ok ? "PASS" : "CHECK"}</span></td></tr>`).join("")}
            <tr><td>Benchmark max rel</td><td>${fmt(bench.max_relative_error, 4)}</td></tr>
            <tr><td>Benchmark max abs</td><td>${fmt(bench.max_absolute_error, 4)}</td></tr>
          </tbody>
        </table>
      `;
    }

    let sceneReady = false;
    function initScene() {
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfbfbf8);
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);
      camera.position.set(110, -105, 72);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, -2);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(0xffffff, 0x8ba2a0, 1.35));
      const sun = new THREE.DirectionalLight(0xffffff, 1.1);
      sun.position.set(80, -60, 120);
      scene.add(sun);

      addMesh(scene, data.mesh.hull, 0x7d8b91, 0.68);
      addMesh(scene, data.mesh.waterplane, 0x3a8b96, 0.18);
      addDeckPlane(scene);
      addDeckPoints(scene);
      addAxes(scene);

      function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        renderer.setSize(rect.width, rect.height, false);
        camera.aspect = rect.width / rect.height;
        camera.updateProjectionMatrix();
      }

      function frame() {
        resize();
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      sceneReady = true;
      frame();
    }

    function addMesh(scene, mesh, color, opacity) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(mesh.vertices, 3));
      geometry.setIndex(mesh.triangles);
      geometry.computeVertexNormals();
      const material = new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0.04, transparent: true, opacity, side: THREE.DoubleSide });
      scene.add(new THREE.Mesh(geometry, material));
      const edgeGeometry = new THREE.BufferGeometry();
      edgeGeometry.setAttribute("position", new THREE.Float32BufferAttribute(mesh.vertices, 3));
      edgeGeometry.setIndex(mesh.edges);
      scene.add(new THREE.LineSegments(edgeGeometry, new THREE.LineBasicMaterial({ color: 0x586560, transparent: true, opacity: 0.42 })));
    }

    function addDeckPlane(scene) {
      const p = data.case.platform;
      const geometry = new THREE.PlaneGeometry(p.length_m, p.beam_m);
      const material = new THREE.MeshBasicMaterial({ color: 0xf3d28a, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
      const deck = new THREE.Mesh(geometry, material);
      deck.position.z = p.deck_z_m;
      scene.add(deck);
    }

    function addDeckPoints(scene) {
      const sphere = new THREE.SphereGeometry(1.35, 24, 16);
      for (const point of data.case.deck_points) {
        const isCenter = point.id === "landing_center";
        const material = new THREE.MeshStandardMaterial({ color: isCenter ? 0xc44930 : 0x227a52, roughness: 0.4 });
        const marker = new THREE.Mesh(sphere, material);
        marker.position.set(...point.position_m);
        scene.add(marker);
      }
    }

    function addAxes(scene) {
      const axes = new THREE.AxesHelper(18);
      axes.position.set(-66, -31, 0);
      scene.add(axes);
    }

    function update() {
      updateMetrics();
      drawChart();
    }

    populateControls();
    updateCaseNote();
    updateMetrics();
    drawChart();
    updateSeaSummary();
    updateValidation();
    if (!sceneReady) initScene();
  </script>
</body>
</html>
