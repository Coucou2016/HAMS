<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrono Real Leg Backend Self-Test</title>
  <script src="chrono-real-leg-backend-selftest-data.js"></script>
  <style>
    :root { --ink:#18202a; --muted:#5e6875; --line:#d7dde7; --panel:#f7f9fc; --good:#047857; --bad:#b91c1c; --accent:#0f766e; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; color:var(--ink); background:#fff; }
    header { padding:18px 24px 14px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    nav { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; font-size:13px; }
    nav a { color:var(--accent); text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    h1 { margin:0 0 8px; font-size:clamp(24px,3vw,36px); line-height:1.15; letter-spacing:0; }
    h2 { margin:0 0 12px; font-size:19px; letter-spacing:0; }
    .lead { max-width:980px; margin:0; color:var(--muted); line-height:1.55; }
    main { max-width:1180px; margin:0 auto; padding:22px 24px 44px; }
    section { margin:0 0 30px; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    .metric { border:1px solid var(--line); border-radius:8px; padding:14px; background:var(--panel); min-height:92px; }
    .metric .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .metric .value { margin-top:8px; font-size:27px; font-weight:700; letter-spacing:0; overflow-wrap:anywhere; }
    .good { color:var(--good); }
    .bad { color:var(--bad); }
    .note { border-left:4px solid var(--accent); padding:10px 12px; background:#eefaf7; color:#16443f; line-height:1.55; }
    table { width:100%; border-collapse:collapse; border:1px solid var(--line); font-size:13px; line-height:1.45; }
    th,td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; }
    th { background:#eef3f8; }
    tr:last-child td { border-bottom:0; }
    code { font-family:Consolas,"SFMono-Regular",monospace; font-size:12px; background:#eef3f8; padding:2px 4px; border-radius:4px; }
    .empty { padding:18px; color:var(--muted); border:1px dashed var(--line); }
    @media (max-width:860px) { main,header { padding-left:16px; padding-right:16px; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="chrono-final-acceptance.html">Final audit</a>
      <a href="chrono-real-leg-mechanism.html">Real runtime</a>
      <a href="real-leg-mechanism-builder.html">Builder gate</a>
      <a href="leg-mechanism-import-selftest.html">Import self-test</a>
      <a href="leg-mechanism-validation.html">Data validation</a>
      <a href="leg-mechanism-gap-tracker.html">Gap tracker</a>
      <a href="leg-mechanism-data-request-pack.html">Request pack</a>
      <a href="leg-mechanism-data-request-lint.html">Request lint</a>
      <a href="chrono-stage3-tripod.html">Stage 3A</a>
    </nav>
    <h1>Chrono 真实支腿后端自测</h1>
    <p class="lead">用 synthetic config 验证真实配置到 PyChrono body、球铰和缓冲器 link 的装配路径。该结果不是论文复现，也不是 Adams 等价验证。</p>
  </header>
  <main id="app"><div class="empty">等待 <code>chrono-real-leg-backend-selftest-data.js</code> 数据。</div></main>
  <script>
    const data = window.CHRONO_REAL_LEG_BACKEND_SELFTEST;
    const app = document.getElementById("app");
    function esc(value){ return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch])); }
    function metric(label,value,cls=""){ return `<div class="metric"><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div>`; }
    function manifestRows(m){ return [["Legs",m.leg_count],["Bodies",m.body_count],["Joints",m.joint_count],["Force elements",m.force_element_count],["Scope",m.scope]].map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join(""); }
    if(!data){
      app.innerHTML = '<div class="empty">没有找到后端自测报告。请运行 <code>.\\.tools\\chrono-env\\python.exe .\\analysis\\rocket_recovery\\chrono_real_leg_backend_selftest.py report</code>。</div>';
    } else {
      const result = data.backend_result || {};
      const manifest = result.manifest || {};
      app.innerHTML = `
        <section class="summary">
          ${metric("Status", data.status, data.status === "PASS" ? "good" : "bad")}
          ${metric("Backend pass", result.pass, result.pass ? "good" : "bad")}
          ${metric("Bodies", result.created_body_count)}
          ${metric("Links", result.created_link_count)}
        </section>
        <section><div class="note">${esc(data.warning || data.error)}</div></section>
        <section>
          <h2>Manifest</h2>
          <table><tbody>${manifestRows(manifest)}</tbody></table>
        </section>
        <section>
          <h2>Config</h2>
          <table><tbody>
            <tr><td>Path</td><td><code>${esc(data.config_path)}</code></td></tr>
            <tr><td>Synthetic only</td><td>${esc(data.synthetic_only)}</td></tr>
            <tr><td>Not literature reproduction</td><td>${esc(data.not_literature_reproduction)}</td></tr>
          </tbody></table>
        </section>
      `;
    }
  </script>
</body>
</html>
