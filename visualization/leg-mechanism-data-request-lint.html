<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrono Real Leg Data Request Pack Lint</title>
  <script src="leg-mechanism-data-request-lint-data.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5d6876;
      --line: #d8dee8;
      --panel: #f7f9fc;
      --accent: #0f766e;
      --good: #047857;
      --warn: #b45309;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fff; font-family: "Segoe UI", Arial, sans-serif; }
    header { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; font-size: 13px; }
    nav a { color: var(--accent); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 36px); line-height: 1.15; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 19px; letter-spacing: 0; }
    .lead { max-width: 980px; margin: 0; color: var(--muted); line-height: 1.55; }
    main { max-width: 1220px; margin: 0 auto; padding: 22px 24px 44px; }
    section { margin: 0 0 30px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .metric { min-height: 92px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .metric .value { margin-top: 8px; font-size: 25px; font-weight: 700; letter-spacing: 0; overflow-wrap: anywhere; }
    .PASS, .good { color: var(--good); }
    .CHECK, .MISSING, .bad { color: var(--bad); }
    table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #eef3f8; }
    tr:last-child td { border-bottom: 0; }
    code { font-family: Consolas, "SFMono-Regular", monospace; font-size: 12px; background: #eef3f8; padding: 2px 4px; border-radius: 4px; }
    .empty { padding: 18px; color: var(--muted); border: 1px dashed var(--line); }
    @media (max-width: 860px) { main, header { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="chrono-final-acceptance.html">Final audit</a>
      <a href="leg-mechanism-data-request-pack.html">Request pack</a>
      <a href="leg-mechanism-gap-tracker.html">Gap tracker</a>
      <a href="leg-mechanism-contract.html">Data contract</a>
      <a href="leg-mechanism-import.html">Data import</a>
      <a href="leg-mechanism-validation.html">Data validation</a>
      <a href="real-leg-mechanism-builder.html">Builder gate</a>
      <a href="chrono-real-leg-mechanism.html">Real runtime</a>
    </nav>
    <h1>真实支腿机构数据补齐包 Lint</h1>
    <p class="lead">检查 `.todo.csv` 是否覆盖全部 strict blocking field、是否与导入 schema 对齐、是否避免被误导入、是否保留 strict source gate。</p>
  </header>
  <main id="app">
    <div class="empty">等待 <code>leg-mechanism-data-request-lint-data.js</code> 数据。</div>
  </main>
  <script>
    const data = window.LEG_MECHANISM_DATA_REQUEST_LINT;
    const app = document.getElementById("app");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function metric(label, value, cls = "") {
      return `<div class="metric"><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div>`;
    }

    function checkRows(rows) {
      return (rows || []).map(row => `<tr>
        <td><code>${esc(row.id)}</code></td>
        <td class="${esc(row.status)}"><strong>${esc(row.status)}</strong></td>
        <td>${esc(row.evidence)}</td>
        <td>${esc((row.blockers || []).slice(0, 8).join(", "))}</td>
      </tr>`).join("");
    }

    function coverageRows(rows) {
      return (rows || []).map(row => `<tr>
        <td><code>${esc(row.name)}</code></td>
        <td>${esc(row.expected_count)}</td>
        <td>${esc(row.actual_count)}</td>
        <td>${esc(row.missing_count)}</td>
        <td>${esc(row.extra_count)}</td>
      </tr>`).join("");
    }

    if (!data) {
      app.innerHTML = '<div class="empty">没有找到 lint 数据。请运行 <code>.\\.tools\\chrono-env\\python.exe .\\analysis\\rocket_recovery\\leg_mechanism_data_request_lint.py report</code>。</div>';
    } else {
      app.innerHTML = `
        <section class="summary">
          ${metric("Status", data.overall_status, data.pass ? "good" : "bad")}
          ${metric("Checks", `${data.summary.passing_check_count}/${data.summary.check_count}`, data.pass ? "good" : "bad")}
          ${metric("Blocking fields", data.summary.blocking_field_count)}
          ${metric("Request dir", data.request_dir)}
        </section>
        <section>
          <h2>Checks</h2>
          <table>
            <thead><tr><th>ID</th><th>Status</th><th>Evidence</th><th>Blockers</th></tr></thead>
            <tbody>${checkRows(data.checks)}</tbody>
          </table>
        </section>
        <section>
          <h2>Coverage</h2>
          <table>
            <thead><tr><th>Group</th><th>Expected</th><th>Actual</th><th>Missing</th><th>Extra</th></tr></thead>
            <tbody>${coverageRows(data.coverage_evidence)}</tbody>
          </table>
        </section>
      `;
    }
  </script>
</body>
</html>
