<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thies Buffer Curves</title>
  <script src="thies-buffer-curves-data.js"></script>
  <style>
    :root { --ink:#17211d; --muted:#63716b; --line:#d9e1dd; --wash:#f5f7f6; --ok:#237653; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif; }
    header { padding:20px 28px 12px; border-bottom:1px solid var(--line); background:#fbfcfb; }
    h1,h2 { margin:0; letter-spacing:0; }
    h1 { font-size:23px; }
    h2 { font-size:16px; margin-bottom:12px; }
    nav { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    nav a { color:var(--muted); text-decoration:none; font-size:13px; padding:6px 9px; border:1px solid var(--line); background:#fff; border-radius:6px; }
    nav a[aria-current="page"] { color:var(--ink); border-color:#9eb5ad; }
    main { padding:18px; display:grid; grid-template-columns:1fr; gap:18px; }
    section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(120px,1fr)); gap:12px; }
    .metric { border:1px solid var(--line); border-radius:8px; padding:12px; background:#fff; }
    .metric strong { display:block; font-size:22px; margin-top:4px; }
    .note { color:var(--muted); font-size:13px; line-height:1.55; margin:8px 0 0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    svg { width:100%; height:320px; border:1px solid var(--line); background:#fff; }
    img { max-width:100%; border:1px solid var(--line); border-radius:6px; background:#fff; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { padding:8px 7px; border-bottom:1px solid #e5ece8; text-align:left; vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    .ok { color:var(--ok); font-weight:800; }
    @media (max-width:900px) { .summary,.grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Thies 2022 缓冲器曲线数字化</h1>
    <p class="note">从 PDF 第 7 页 Figure 4/5 提取弹簧力-行程和阻尼力-速度曲线，并转换为 Chrono 正压缩表格 law。</p>
    <nav>
      <a href="chrono-final-acceptance.html">最终审计</a>
      <a href="literature-comparison-registry.html">文献注册表</a>
      <a href="thies-buffer-curves.html" aria-current="page">Thies 缓冲曲线</a>
      <a href="chrono-stage3-thies-buffer.html">Thies Buffer 动画</a>
      <a href="chrono-stage3-lock-two-way.html">锁紧双向</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>总览</h2>
      <div class="summary" id="summary"></div>
      <p class="note" id="claim"></p>
    </section>
    <section class="grid">
      <div>
        <h2>弹簧力-行程</h2>
        <svg id="springPlot" viewBox="0 0 640 320"></svg>
        <p class="note" id="springMeta"></p>
      </div>
      <div>
        <h2>阻尼力-速度</h2>
        <svg id="damperPlot" viewBox="0 0 640 320"></svg>
        <p class="note" id="damperMeta"></p>
      </div>
    </section>
    <section class="grid">
      <div>
        <h2>Figure 4 裁剪图</h2>
        <img id="springImage" alt="Thies Figure 4 crop">
      </div>
      <div>
        <h2>Figure 5 裁剪图</h2>
        <img id="damperImage" alt="Thies Figure 5 crop">
      </div>
    </section>
    <section>
      <h2>Chrono Table Law</h2>
      <table><tbody id="lawRows"></tbody></table>
    </section>
  </main>
  <script>
    const data = window.THIES_BUFFER_CURVES;
    function esc(value){ return String(value ?? "").replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s])); }
    function plot(svg, points, xKey, yKey, xLabel, yLabel){
      const w = 640, h = 320, l = 58, r = 18, t = 18, b = 44;
      const xs = points.map(p => p[xKey]);
      const ys = points.map(p => p[yKey]);
      const xmax = Math.max(...xs, 1e-9);
      const ymax = Math.max(...ys, 1e-9);
      const px = x => l + x / xmax * (w - l - r);
      const py = y => h - b - y / ymax * (h - t - b);
      const path = points.map((p,i) => `${i ? "L" : "M"} ${px(p[xKey]).toFixed(2)} ${py(p[yKey]).toFixed(2)}`).join(" ");
      const grid = [];
      for(let i=0;i<=4;i++){
        const x = l + i/4*(w-l-r);
        const y = t + i/4*(h-t-b);
        grid.push(`<line x1="${x}" y1="${t}" x2="${x}" y2="${h-b}" stroke="#e7eeea"/>`);
        grid.push(`<line x1="${l}" y1="${y}" x2="${w-r}" y2="${y}" stroke="#e7eeea"/>`);
      }
      svg.innerHTML = `
        ${grid.join("")}
        <line x1="${l}" y1="${h-b}" x2="${w-r}" y2="${h-b}" stroke="#506059"/>
        <line x1="${l}" y1="${t}" x2="${l}" y2="${h-b}" stroke="#506059"/>
        <path d="${path}" fill="none" stroke="#2d76b8" stroke-width="3"/>
        <text x="${w/2}" y="${h-10}" text-anchor="middle" font-size="13">${esc(xLabel)}</text>
        <text x="15" y="${h/2}" transform="rotate(-90 15 ${h/2})" text-anchor="middle" font-size="13">${esc(yLabel)}</text>
        <text x="${l}" y="${h-b+18}" font-size="11">0</text>
        <text x="${w-r-52}" y="${h-b+18}" font-size="11">${xmax.toPrecision(3)}</text>
        <text x="8" y="${py(ymax)+4}" font-size="11">${(ymax/1000).toPrecision(3)} kN</text>
      `;
    }
    function render(){
      if(!data){ document.body.innerHTML = "<main><section><h1>缺少 thies-buffer-curves-data.js</h1><p>请先运行 thies_buffer_digitization.py report。</p></section></main>"; return; }
      const law = data.chrono_buffer_law || {};
      const spring = data.curves.spring_force_stroke;
      const damper = data.curves.damper_force_velocity;
      document.getElementById("summary").innerHTML = [
        ["Status", data.status],
        ["Validation", data.validation.pass ? "PASS" : "CHECK"],
        ["Spring Points", law.force_stroke_points?.length || 0],
        ["Damper Points", law.force_velocity_points?.length || 0],
      ].map(([k,v]) => `<div class="metric"><span>${esc(k)}</span><strong class="${v === "PASS" ? "ok" : ""}">${esc(v)}</strong></div>`).join("");
      document.getElementById("claim").textContent = data.claim_boundary || "";
      plot(document.getElementById("springPlot"), law.force_stroke_points || [], "stroke_m", "force_n", "compression stroke [m]", "spring force [N]");
      plot(document.getElementById("damperPlot"), law.force_velocity_points || [], "velocity_m_s", "force_n", "compression velocity [m/s]", "damper force [N]");
      document.getElementById("springMeta").textContent = `${spring.figure}, raw ${spring.raw_point_count}, coverage ${spring.coverage_ratio.toFixed(3)}`;
      document.getElementById("damperMeta").textContent = `${damper.figure}, raw ${damper.raw_point_count}, coverage ${damper.coverage_ratio.toFixed(3)}`;
      document.getElementById("springImage").src = spring.crop_png_public || "";
      document.getElementById("damperImage").src = damper.crop_png_public || "";
      document.getElementById("lawRows").innerHTML = [
        ["type", law.type],
        ["source", law.source],
        ["stroke_limit_m", law.stroke_limit_m],
        ["hard_stop_note", law.digitization?.hard_stop_note],
        ["method", law.digitization?.method],
      ].map(([k,v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("");
    }
    render();
  </script>
</body>
</html>
