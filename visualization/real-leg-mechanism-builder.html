<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrono Real Leg Mechanism Builder Gate</title>
  <script src="real-leg-mechanism-builder-data.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202a;
      --muted: #5e6875;
      --line: #d7dde7;
      --panel: #f7f9fc;
      --good: #047857;
      --warn: #b45309;
      --bad: #b91c1c;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #fff;
    }
    header {
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    nav a {
      color: var(--accent);
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .lead {
      max-width: 980px;
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 22px 24px 44px;
    }
    section { margin: 0 0 30px; }
    h2 {
      margin: 0 0 12px;
      font-size: 19px;
      letter-spacing: 0;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: var(--panel);
      min-height: 92px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .metric .value {
      margin-top: 8px;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .good { color: var(--good); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .note {
      border-left: 4px solid var(--warn);
      padding: 10px 12px;
      background: #fff8ed;
      color: #573900;
      line-height: 1.55;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    th { background: #eef3f8; }
    tr:last-child td { border-bottom: 0; }
    code {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      background: #eef3f8;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .empty {
      padding: 18px;
      color: var(--muted);
      border: 1px dashed var(--line);
    }
    @media (max-width: 860px) {
      main, header { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="chrono-final-acceptance.html">Final audit</a>
      <a href="leg-mechanism-contract.html">Data contract</a>
      <a href="leg-mechanism-import.html">Data import</a>
      <a href="leg-mechanism-import-selftest.html">Import self-test</a>
      <a href="leg-mechanism-validation.html">Data validation</a>
      <a href="leg-mechanism-gap-tracker.html">Gap tracker</a>
      <a href="leg-mechanism-data-request-pack.html">Request pack</a>
      <a href="leg-mechanism-data-request-lint.html">Request lint</a>
      <a href="chrono-real-leg-mechanism.html">Real runtime</a>
      <a href="chrono-real-leg-backend-selftest.html">Backend self-test</a>
      <a href="chrono-stage3-tripod.html">Stage 3A</a>
      <a href="chrono-stage3c-rigid-body-link.html">Stage 3C</a>
    </nav>
    <h1>Chrono 真实支腿机构 Builder Gate</h1>
    <p class="lead">只有当支腿机构数据校验通过时，才允许从模板生成真实 Chrono 机构配置。当前页面记录是否已生成可运行配置，或为何被阻止。</p>
  </header>
  <main id="app">
    <div class="empty">等待 <code>real-leg-mechanism-builder-data.js</code> 数据。</div>
  </main>
  <script>
    const gate = window.REAL_LEG_MECHANISM_BUILDER_GATE;
    const app = document.getElementById("app");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function metric(label, value, cls = "") {
      return `<div class="metric"><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div>`;
    }

    function checkRows(rows) {
      return (rows || []).map(row => `<tr>
        <td><code>${esc(row.id)}</code></td>
        <td><strong>${esc(row.status)}</strong></td>
        <td>${esc(row.evidence)}</td>
      </tr>`).join("");
    }

    function fieldRows(rows) {
      return (rows || []).slice(0, 100).map(row => `<tr>
        <td><code>${esc(row.path)}</code></td>
        <td>${esc(row.source_category)}</td>
        <td>${esc(row.source_detail)}</td>
      </tr>`).join("");
    }

    function sectionRows(rows) {
      return (rows || []).map(row => `<tr><td><code>${esc(row)}</code></td></tr>`).join("");
    }

    if (!gate) {
      app.innerHTML = '<div class="empty">没有找到 builder gate 数据。请运行 <code>.\\.tools\\chrono-env\\python.exe .\\analysis\\rocket_recovery\\real_leg_mechanism_builder.py report</code>。</div>';
    } else {
      app.innerHTML = `
        <section class="summary">
          ${metric("Ready", gate.ready ? "YES" : "NO", gate.ready ? "good" : "bad")}
          ${metric("Status", gate.overall_status, gate.ready ? "good" : "bad")}
          ${metric("Config written", gate.config_written ? "YES" : "NO", gate.config_written ? "good" : "warn")}
          ${metric("Target", gate.config_path)}
        </section>
        <section>
          <div class="note">${esc(gate.policy.default_behavior)} ${esc(gate.policy.current_fallback)}</div>
        </section>
        <section>
          <h2>Blocking Checks</h2>
          <table>
            <thead><tr><th>ID</th><th>Status</th><th>Evidence</th></tr></thead>
            <tbody>${checkRows(gate.blocking_checks)}</tbody>
          </table>
        </section>
        <section>
          <h2>Output Sections When Ready</h2>
          <table><tbody>${sectionRows(gate.would_build_sections_when_ready)}</tbody></table>
        </section>
        <section>
          <h2>Blocking Fields</h2>
          <table>
            <thead><tr><th>Path</th><th>Source</th><th>Detail</th></tr></thead>
            <tbody>${fieldRows(gate.blocking_fields)}</tbody>
          </table>
        </section>
      `;
    }
  </script>
</body>
</html>
