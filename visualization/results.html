<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAMS Case Results</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18211f;
      --muted: #5d6964;
      --paper: #f4f1ea;
      --panel: #fffdf8;
      --line: #c8c0b4;
      --soft-line: #ded8ce;
      --teal: #287d7a;
      --orange: #d8872f;
      --blue: #2f6fa3;
      --rose: #b54c6d;
      --green: #527f46;
      --violet: #6657a3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: "Microsoft YaHei", Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    body {
      overflow-y: auto;
    }

    a {
      color: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav a,
    select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      text-decoration: none;
      font-size: 14px;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(280px, 350px) minmax(0, 1fr);
      min-height: calc(100vh - 64px);
    }

    aside {
      padding: 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    select {
      width: 100%;
      padding: 0 10px;
    }

    .case-title {
      margin: 6px 0 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .summary {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .mesh-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      background: #faf8f2;
    }

    dl {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 12px;
      margin: 0;
      font-size: 13px;
    }

    dt {
      color: var(--muted);
    }

    dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .paths {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-content: start;
      padding: 18px;
    }

    .chart-card {
      display: grid;
      grid-template-rows: auto minmax(270px, 340px) auto;
      gap: 10px;
      min-width: 0;
      min-height: 380px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .chart-head {
      min-width: 0;
    }

    .chart-head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .chart-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 270px;
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      background: #fffefa;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      min-height: 40px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: currentColor;
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      .charts {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .charts,
      aside {
        padding: 12px;
      }

      .chart-card {
        grid-template-rows: auto minmax(250px, 300px) auto;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>HAMS Case Results</h1>
    <nav class="nav" aria-label="Page navigation">
      <a href="viewer.html">3D Mesh</a>
      <a href="results.html" aria-current="page">Results</a>
      <a href="rocket-recovery.html">Rocket Recovery</a>
      <a href="nargolkar-2025.html">Paper 2025</a>
      <a href="wang-2023.html">Wang 2023</a>
      <a href="landing-leg-contact.html">Leg Contact</a>
      <a href="integrated-recovery.html">Integrated</a>
      <a href="chrono-recovery.html">Chrono</a>
    </nav>
  </header>

  <main class="shell">
    <aside>
      <div class="controls">
        <div>
          <label for="caseSelect">Case</label>
          <select id="caseSelect"></select>
        </div>

        <div>
          <label for="headingSelect">Wave heading</label>
          <select id="headingSelect"></select>
        </div>

        <section>
          <h2 class="case-title" id="caseTitle"></h2>
          <p class="summary" id="caseSummary"></p>
        </section>

        <img class="mesh-image" id="meshImage" alt="">

        <dl>
          <dt>Hull panels</dt>
          <dd id="hullPanels">0</dd>
          <dt>Waterplane panels</dt>
          <dd id="waterPanels">0</dd>
          <dt>Wave headings</dt>
          <dd id="headingCount">0</dd>
          <dt>Frequencies</dt>
          <dd id="frequencyCount">0</dd>
          <dt>Water depth</dt>
          <dd id="waterDepth">0</dd>
          <dt>OpenMP threads</dt>
          <dd id="threadCount">0</dd>
        </dl>

        <div class="paths">
          <span id="controlPath"></span>
          <span id="outputPath"></span>
          <span id="generatedAt"></span>
        </div>
      </div>
    </aside>

    <section class="charts" aria-label="Hydrodynamic result charts">
      <article class="chart-card" data-card="addedMass">
        <div class="chart-head">
          <h2>Added Mass Aii</h2>
          <p></p>
        </div>
        <canvas data-chart="addedMass"></canvas>
        <div class="chart-legend" data-legend="addedMass"></div>
      </article>

      <article class="chart-card" data-card="waveDamping">
        <div class="chart-head">
          <h2>Radiation Damping Bii</h2>
          <p></p>
        </div>
        <canvas data-chart="waveDamping"></canvas>
        <div class="chart-legend" data-legend="waveDamping"></div>
      </article>

      <article class="chart-card" data-card="excitation">
        <div class="chart-head">
          <h2>Wave Excitation</h2>
          <p></p>
        </div>
        <canvas data-chart="excitation"></canvas>
        <div class="chart-legend" data-legend="excitation"></div>
      </article>

      <article class="chart-card" data-card="motion">
        <div class="chart-head">
          <h2>Motion RAO</h2>
          <p></p>
        </div>
        <canvas data-chart="motion"></canvas>
        <div class="chart-legend" data-legend="motion"></div>
      </article>
    </section>
  </main>

  <script src="results-data.js"></script>
  <script>
    const data = window.HAMS_RESULTS_DATA;
    const colors = ["#287d7a", "#d8872f", "#2f6fa3", "#b54c6d", "#527f46", "#6657a3"];
    const caseSelect = document.getElementById("caseSelect");
    const headingSelect = document.getElementById("headingSelect");
    let activeCase = null;
    let resizeFrame = 0;

    for (const item of data.cases) {
      const option = document.createElement("option");
      option.value = item.name;
      option.textContent = item.name;
      caseSelect.appendChild(option);
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "";
      const abs = Math.abs(value);
      if ((abs >= 10000 || (abs > 0 && abs < 0.001))) {
        return value.toExponential(2);
      }
      return Number(value.toPrecision(4)).toString();
    }

    function selectedHeadingIndex() {
      const index = Number(headingSelect.value);
      return Number.isInteger(index) && index >= 0 ? index : 0;
    }

    function makeLegend(group) {
      const legend = document.querySelector(`[data-legend="${group.id}"]`);
      legend.textContent = "";
      group.series.forEach((series, index) => {
        const item = document.createElement("span");
        item.className = "legend-item";
        item.style.color = colors[index % colors.length];

        const dot = document.createElement("span");
        dot.className = "legend-dot";
        item.appendChild(dot);

        const label = document.createElement("span");
        label.textContent = series.name;
        item.appendChild(label);
        legend.appendChild(item);
      });
    }

    function chartPoints(series, headingIndex) {
      return series.points
        .map((point) => ({ x: point.x, y: point.y[headingIndex] }))
        .filter((point) => Number.isFinite(point.x) && Number.isFinite(point.y));
    }

    function paddedRange(values, anchorZero) {
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (anchorZero && min >= 0) min = 0;
      if (min === max) {
        const size = Math.abs(max) || 1;
        min -= size * 0.5;
        max += size * 0.5;
      }
      const span = max - min;
      return [min - span * 0.08, max + span * 0.08];
    }

    function drawChart(canvas, group, headingIndex) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(260, Math.floor(rect.height));
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const allSeries = group.series.map((series) => chartPoints(series, headingIndex));
      const allPoints = allSeries.flat();
      const card = document.querySelector(`[data-card="${group.id}"]`);
      card.querySelector("p").textContent = group.subtitle;

      if (!allPoints.length) {
        ctx.fillStyle = "#5d6964";
        ctx.font = "13px Arial";
        ctx.fillText("No finite values for this heading.", 18, 28);
        return;
      }

      const plot = { left: 70, top: 28, right: 18, bottom: 42 };
      const plotWidth = width - plot.left - plot.right;
      const plotHeight = height - plot.top - plot.bottom;
      const xValues = allPoints.map((point) => point.x);
      const yValues = allPoints.map((point) => point.y);
      const [xMin, xMax] = paddedRange(xValues, false);
      const [yMin, yMax] = paddedRange(yValues, true);

      const sx = (value) => plot.left + ((value - xMin) / (xMax - xMin)) * plotWidth;
      const sy = (value) => plot.top + plotHeight - ((value - yMin) / (yMax - yMin)) * plotHeight;

      ctx.lineWidth = 1;
      ctx.strokeStyle = "#ded8ce";
      ctx.fillStyle = "#5d6964";
      ctx.font = "11px Arial";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      for (let i = 0; i <= 4; i++) {
        const y = plot.top + (plotHeight * i) / 4;
        const value = yMax - ((yMax - yMin) * i) / 4;
        ctx.beginPath();
        ctx.moveTo(plot.left, y);
        ctx.lineTo(plot.left + plotWidth, y);
        ctx.stroke();
        ctx.fillText(formatNumber(value), plot.left - 8, y);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let i = 0; i <= 5; i++) {
        const x = plot.left + (plotWidth * i) / 5;
        const value = xMin + ((xMax - xMin) * i) / 5;
        ctx.beginPath();
        ctx.moveTo(x, plot.top);
        ctx.lineTo(x, plot.top + plotHeight);
        ctx.stroke();
        ctx.fillText(formatNumber(value), x, plot.top + plotHeight + 8);
      }

      ctx.strokeStyle = "#18211f";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(plot.left, plot.top);
      ctx.lineTo(plot.left, plot.top + plotHeight);
      ctx.lineTo(plot.left + plotWidth, plot.top + plotHeight);
      ctx.stroke();

      ctx.fillStyle = "#18211f";
      ctx.font = "12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(group.xLabel, plot.left + plotWidth / 2, height - 17);
      ctx.save();
      ctx.translate(17, plot.top + plotHeight / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(group.yLabel, 0, 0);
      ctx.restore();

      allSeries.forEach((points, index) => {
        if (!points.length) return;
        ctx.strokeStyle = colors[index % colors.length];
        ctx.fillStyle = colors[index % colors.length];
        ctx.lineWidth = 2;
        ctx.beginPath();
        points.forEach((point, pointIndex) => {
          const x = sx(point.x);
          const y = sy(point.y);
          if (pointIndex === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        const radius = points.length <= 8 ? 3 : 2;
        points.forEach((point) => {
          ctx.beginPath();
          ctx.arc(sx(point.x), sy(point.y), radius, 0, Math.PI * 2);
          ctx.fill();
        });
      });
    }

    function drawAll() {
      if (!activeCase) return;
      const headingIndex = selectedHeadingIndex();
      activeCase.groups.forEach((group) => {
        const canvas = document.querySelector(`[data-chart="${group.id}"]`);
        makeLegend(group);
        drawChart(canvas, group, headingIndex);
      });
      document.body.dataset.rendered = "true";
      document.body.dataset.case = activeCase.name;
      document.body.dataset.heading = activeCase.headings[headingIndex] ?? "";
    }

    function scheduleDraw() {
      window.cancelAnimationFrame(resizeFrame);
      resizeFrame = window.requestAnimationFrame(drawAll);
    }

    function loadCase(name) {
      activeCase = data.cases.find((item) => item.name === name) || data.cases[0];
      caseSelect.value = activeCase.name;
      setText("caseTitle", activeCase.name);
      setText("caseSummary", activeCase.summary);
      setText("hullPanels", activeCase.mesh.hullPanels);
      setText("waterPanels", activeCase.mesh.waterPanels);
      setText("headingCount", activeCase.headings.length);
      setText("frequencyCount", activeCase.frequencies.length);
      setText("waterDepth", activeCase.control.waterDepthLabel || "Unknown");
      setText("threadCount", activeCase.control.threads || "0");
      setText("controlPath", `Control: ${activeCase.controlFile}`);
      setText("outputPath", `Output: ${activeCase.outputDir}`);
      setText("generatedAt", `Data: ${data.generatedAt}`);

      const meshImage = document.getElementById("meshImage");
      meshImage.src = activeCase.snapshot;
      meshImage.alt = `${activeCase.name} mesh snapshot`;

      headingSelect.textContent = "";
      activeCase.headings.forEach((heading, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = `${formatNumber(heading)} deg`;
        headingSelect.appendChild(option);
      });
      headingSelect.value = "0";
      drawAll();
    }

    caseSelect.addEventListener("change", () => loadCase(caseSelect.value));
    headingSelect.addEventListener("change", drawAll);
    window.addEventListener("resize", scheduleDraw);
    loadCase(data.cases[0].name);
  </script>
</body>
</html>
