<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAMS/Chrono Model Realism Audit</title>
  <script src="model-realism-audit-data.js?v=20260815-final2"></script>
  <style>
    :root {
      --ink: #17211d;
      --muted: #61706a;
      --line: #d9e1dd;
      --wash: #f5f7f6;
      --ok: #237653;
      --partial: #9a6a12;
      --check: #b94d36;
      --missing: #7f3f98;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wash); color: var(--ink); font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
    header { padding: 20px 28px 14px; border-bottom: 1px solid var(--line); background: #fbfcfb; }
    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 23px; }
    h2 { font-size: 16px; margin-bottom: 12px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line); background: #fff; border-radius: 6px; }
    nav a[aria-current="page"] { color: var(--ink); border-color: #9eb5ad; }
    main { padding: 18px; display: grid; gap: 18px; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 12px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .metric span { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .metric strong { display: block; font-size: 24px; margin-top: 4px; overflow-wrap: anywhere; }
    .note { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 8px 0 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 7px; border-bottom: 1px solid #e5ece8; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .status { font-weight: 800; white-space: nowrap; }
    .PASS { color: var(--ok); }
    .PARTIAL { color: var(--partial); }
    .CHECK { color: var(--check); }
    .MISSING { color: var(--missing); }
    .mono { font-family: Consolas, "SFMono-Regular", monospace; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    ul { margin: 0; padding-left: 20px; line-height: 1.55; font-size: 13px; }
    @media (max-width: 900px) { .summary, .cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>模型真实性审计</h1>
    <p class="note">检查当前结果中哪些是严格复现、哪些是图线数字化、哪些是代理模型或缺数据边界，防止把可运行模型误写成完整论文/Adams 复现。</p>
    <nav>
      <a href="chrono-final-acceptance.html">最终审计</a>
      <a href="model-realism-audit.html" aria-current="page">真实性审计</a>
      <a href="literature-comparison-registry.html">文献注册表</a>
      <a href="chrono-stage3-lock-two-way.html">锁紧双向</a>
      <a href="chrono-stage3-thies-buffer.html">Thies Buffer</a>
      <a href="leg-mechanism-validation.html">机构数据校验</a>
      <a href="leg-mechanism-gap-tracker.html">数据缺口</a>
      <a href="real-leg-mechanism-builder.html">真实机构 Gate</a>
      <a href="nargolkar-2025.html">Nargolkar 2025</a>
      <a href="wang-2023.html">Wang 2023</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>总览</h2>
      <div class="summary" id="summary"></div>
      <p class="note" id="generated"></p>
    </section>
    <section>
      <h2>问题清单</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Status</th><th>Finding</th><th>Evidence</th><th>Impact</th><th>Action</th></tr>
        </thead>
        <tbody id="checks"></tbody>
      </table>
    </section>
    <section class="cols">
      <div>
        <h2>可以声称</h2>
        <ul id="safe"></ul>
      </div>
      <div>
        <h2>暂不能声称</h2>
        <ul id="unsafe"></ul>
      </div>
    </section>
  </main>
  <script>
    const audit = window.MODEL_REALISM_AUDIT;
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function compact(value) {
      if (typeof value === "string") return value;
      return JSON.stringify(value);
    }
    function render() {
      if (!audit) {
        document.body.innerHTML = "<main><section><h1>缺少 model-realism-audit-data.js</h1><p>请先运行 model_realism_audit.py report。</p></section></main>";
        return;
      }
      const summary = audit.summary || {};
      document.getElementById("summary").innerHTML = [
        ["Overall", audit.overall_status],
        ["PASS", summary.PASS || 0],
        ["PARTIAL", summary.PARTIAL || 0],
        ["CHECK", summary.CHECK || 0],
        ["MISSING", summary.MISSING || 0],
      ].map(([k, v]) => `<div class="metric"><span>${esc(k)}</span><strong class="${esc(v)}">${esc(v)}</strong></div>`).join("");
      document.getElementById("generated").textContent = `generated ${audit.generated_utc}`;
      document.getElementById("checks").innerHTML = audit.checks.map(row => `
        <tr>
          <td class="mono">${esc(row.id)}</td>
          <td class="status ${esc(row.status)}">${esc(row.status)}</td>
          <td>${esc(row.finding)}</td>
          <td>${esc(compact(row.evidence))}</td>
          <td>${esc(row.impact)}</td>
          <td>${esc(row.recommended_action)}</td>
        </tr>
      `).join("");
      document.getElementById("safe").innerHTML = audit.claim_boundary.safe_to_claim.map(item => `<li>${esc(item)}</li>`).join("");
      document.getElementById("unsafe").innerHTML = audit.claim_boundary.not_safe_to_claim_yet.map(item => `<li>${esc(item)}</li>`).join("");
    }
    render();
  </script>
</body>
</html>
