<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrono Real Leg Data Request Pack</title>
  <script src="leg-mechanism-data-request-pack-data.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5d6876;
      --line: #d8dee8;
      --panel: #f7f9fc;
      --accent: #0f766e;
      --warn: #b45309;
      --bad: #b91c1c;
      --good: #047857;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fff; font-family: "Segoe UI", Arial, sans-serif; }
    header { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; font-size: 13px; }
    nav a { color: var(--accent); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 36px); line-height: 1.15; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 19px; letter-spacing: 0; }
    .lead { max-width: 980px; margin: 0; color: var(--muted); line-height: 1.55; }
    main { max-width: 1220px; margin: 0 auto; padding: 22px 24px 44px; }
    section { margin: 0 0 30px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .metric { min-height: 92px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .metric .value { margin-top: 8px; font-size: 25px; font-weight: 700; letter-spacing: 0; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #eef3f8; }
    tr:last-child td { border-bottom: 0; }
    code { font-family: Consolas, "SFMono-Regular", monospace; font-size: 12px; background: #eef3f8; padding: 2px 4px; border-radius: 4px; }
    .note { border-left: 4px solid var(--warn); padding: 10px 12px; background: #fff8ed; color: #573900; line-height: 1.55; }
    .empty { padding: 18px; color: var(--muted); border: 1px dashed var(--line); }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    @media (max-width: 860px) { main, header { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="chrono-final-acceptance.html">Final audit</a>
      <a href="leg-mechanism-gap-tracker.html">Gap tracker</a>
      <a href="leg-mechanism-data-request-lint.html">Request lint</a>
      <a href="leg-mechanism-contract.html">Data contract</a>
      <a href="leg-mechanism-import.html">Data import</a>
      <a href="leg-mechanism-validation.html">Data validation</a>
      <a href="real-leg-mechanism-builder.html">Builder gate</a>
      <a href="chrono-real-leg-mechanism.html">Real runtime</a>
    </nav>
    <h1>真实支腿机构数据补齐包</h1>
    <p class="lead">把 strict gate 的 120 个阻塞字段整理成可分发、可填写的 todo CSV。文件名故意使用 <code>.todo.csv</code>，避免空模板被误导入正式模型。</p>
  </header>
  <main id="app">
    <div class="empty">等待 <code>leg-mechanism-data-request-pack-data.js</code> 数据。</div>
  </main>
  <script>
    const data = window.LEG_MECHANISM_DATA_REQUEST_PACK;
    const app = document.getElementById("app");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function metric(label, value, cls = "") {
      return `<div class="metric"><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div>`;
    }

    function fileRows(rows) {
      return (rows || []).map(row => `<tr>
        <td><code>${esc(row.path)}</code></td>
        <td>${esc(row.row_count ?? "")}</td>
        <td>${esc(row.purpose)}</td>
      </tr>`).join("");
    }

    function classRows(counts) {
      return Object.entries(counts || {}).map(([key, value]) => `<tr>
        <td><code>${esc(key)}</code></td>
        <td><strong>${esc(value)}</strong></td>
      </tr>`).join("");
    }

    function commandRows(rows) {
      return (rows || []).map(row => `<tr><td><code>${esc(row)}</code></td></tr>`).join("");
    }

    if (!data) {
      app.innerHTML = '<div class="empty">没有找到数据。请运行 <code>.\\.tools\\chrono-env\\python.exe .\\analysis\\rocket_recovery\\leg_mechanism_data_request_pack.py report</code>。</div>';
    } else {
      app.innerHTML = `
        <section class="summary">
          ${metric("Status", data.overall_status)}
          ${metric("Blocking fields", data.strict_blocking_field_count, data.strict_blocking_field_count ? "bad" : "good")}
          ${metric("Todo files", data.todo_file_count)}
          ${metric("Request dir", data.request_dir)}
        </section>
        <section>
          <div class="note">${esc((data.guardrails || []).join(" "))}</div>
        </section>
        <section>
          <h2>Todo Files</h2>
          <table>
            <thead><tr><th>Path</th><th>Rows</th><th>Purpose</th></tr></thead>
            <tbody>${fileRows(data.files)}</tbody>
          </table>
        </section>
        <section>
          <h2>Field Classes</h2>
          <table>
            <thead><tr><th>Class</th><th>Count</th></tr></thead>
            <tbody>${classRows(data.counts_by_field_class)}</tbody>
          </table>
        </section>
        <section>
          <h2>Commands After Filling Real Data</h2>
          <table><tbody>${commandRows(data.next_commands_after_filling)}</tbody></table>
        </section>
      `;
    }
  </script>
</body>
</html>
