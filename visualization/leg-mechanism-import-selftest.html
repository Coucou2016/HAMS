<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrono Leg Mechanism Import Self-Test</title>
  <script src="leg-mechanism-import-selftest-data.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202a;
      --muted: #5e6875;
      --line: #d7dde7;
      --panel: #f7f9fc;
      --good: #047857;
      --bad: #b91c1c;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #fff;
    }
    header {
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    nav a { color: var(--accent); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .lead {
      max-width: 980px;
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 24px 44px;
    }
    section { margin: 0 0 30px; }
    h2 { margin: 0 0 12px; font-size: 19px; letter-spacing: 0; }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: var(--panel);
      min-height: 92px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .metric .value {
      margin-top: 8px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    th { background: #eef3f8; }
    tr:last-child td { border-bottom: 0; }
    code {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      background: #eef3f8;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .note {
      border-left: 4px solid var(--accent);
      padding: 10px 12px;
      background: #eefaf7;
      color: #16443f;
      line-height: 1.55;
    }
    .empty {
      padding: 18px;
      color: var(--muted);
      border: 1px dashed var(--line);
    }
    @media (max-width: 860px) {
      main, header { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="chrono-final-acceptance.html">Final audit</a>
      <a href="leg-mechanism-contract.html">Data contract</a>
      <a href="leg-mechanism-import.html">Data import</a>
      <a href="leg-mechanism-validation.html">Data validation</a>
      <a href="leg-mechanism-gap-tracker.html">Gap tracker</a>
      <a href="leg-mechanism-data-request-pack.html">Request pack</a>
      <a href="leg-mechanism-data-request-lint.html">Request lint</a>
      <a href="real-leg-mechanism-builder.html">Builder gate</a>
      <a href="chrono-real-leg-mechanism.html">Real runtime</a>
      <a href="chrono-real-leg-backend-selftest.html">Backend self-test</a>
      <a href="chrono-stage3-tripod.html">Stage 3A</a>
    </nav>
    <h1>Chrono 支腿机构导入自测</h1>
    <p class="lead">用合成四腿 CSV 数据验证导入、校验和 builder 代码路径。该页面只证明工具链可用，不证明真实 Adams 等价支腿数据已经具备。</p>
  </header>
  <main id="app">
    <div class="empty">等待 <code>leg-mechanism-import-selftest-data.js</code> 数据。</div>
  </main>
  <script>
    const report = window.LEG_MECHANISM_IMPORT_SELFTEST;
    const app = document.getElementById("app");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function metric(label, value, cls = "") {
      return `<div class="metric"><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div>`;
    }

    function checkRows(rows) {
      return (rows || []).map(row => `<tr>
        <td><code>${esc(row.id)}</code></td>
        <td class="${row.pass ? "good" : "bad"}"><strong>${esc(row.pass)}</strong></td>
        <td>${esc(row.evidence)}</td>
      </tr>`).join("");
    }

    function csvRows(rows) {
      return (rows || []).map(row => `<tr>
        <td><code>${esc(row.path)}</code></td>
        <td>${esc(row.rows)}</td>
      </tr>`).join("");
    }

    if (!report) {
      app.innerHTML = '<div class="empty">没有找到自测报告。请运行 <code>.\\.tools\\chrono-env\\python.exe .\\analysis\\rocket_recovery\\leg_mechanism_import_selftest.py report</code>。</div>';
    } else {
      app.innerHTML = `
        <section class="summary">
          ${metric("Status", report.status, report.status === "PASS" ? "good" : "bad")}
          ${metric("Validation", report.validation_ready ? "ready" : "blocked", report.validation_ready ? "good" : "bad")}
          ${metric("Builder", report.builder_status)}
          ${metric("Synthetic only", report.synthetic_only ? "YES" : "NO")}
        </section>
        <section><div class="note">${esc(report.warning)}</div></section>
        <section>
          <h2>Checks</h2>
          <table><thead><tr><th>ID</th><th>Pass</th><th>Evidence</th></tr></thead><tbody>${checkRows(report.checks)}</tbody></table>
        </section>
        <section>
          <h2>Outputs</h2>
          <table><tbody>
            <tr><td>Imported template</td><td><code>${esc(report.import_report && report.import_report.output_path)}</code></td></tr>
            <tr><td>Validation JSON</td><td><code>${esc(report.validation_path)}</code></td></tr>
            <tr><td>Builder JSON</td><td><code>${esc(report.builder_path)}</code></td></tr>
            <tr><td>Synthetic config</td><td><code>${esc(report.synthetic_config_path)}</code></td></tr>
            <tr><td>Production config touched</td><td>${esc(report.production_config_written_by_selftest)}</td></tr>
          </tbody></table>
        </section>
        <section>
          <h2>CSV Fixture</h2>
          <table><thead><tr><th>File</th><th>Rows</th></tr></thead><tbody>${csvRows(report.csv_summary && report.csv_summary.files)}</tbody></table>
        </section>
      `;
    }
  </script>
</body>
</html>
